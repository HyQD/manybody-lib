[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manybody_lib"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.5.2,<2.6",
    "scipy>=1.18.0,<1.19",
    "opt-einsum>=3.4.0,<3.5",
    "numba>=0.67.0,<0.68",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pyscf>=2.14,<3",
    "sympy>=1.14,<1.15",
]
symbolic = [
    "sympy>=1.14,<1.15",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests using optional external development dependencies",
]

[tool.setuptools.packages.find]
include = ["manybody_lib*"]
